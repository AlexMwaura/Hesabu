# Postgres for running the cloud server locally. The fakes, the hub and the tests need nothing else.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hesabu
      POSTGRES_USER: hesabu
      POSTGRES_PASSWORD: hesabu
    ports:
      - "5433:5432"
    volumes:
      - hesabu-pg:/var/lib/postgresql/data
volumes:
  hesabu-pg:
